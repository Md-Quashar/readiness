services:
  # ── Development (hot reload) ─────────────────────────────────────────
  eee-frontend-dev:
    image: node:20-alpine
    container_name: eee-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules   # anonymous volume — keeps container's node_modules isolated
    restart: unless-stopped
    profiles: ["dev"]

  # ── Production (nginx) ───────────────────────────────────────────────
  eee-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eee-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    profiles: ["prod"]
